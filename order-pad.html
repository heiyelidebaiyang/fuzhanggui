<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点餐开单 · 商河县李家大院饭店1</title>
<style>
:root{
  --paper:#F4F1EA; --card:#FFFFFF; --ink:#1F1B16; --ink2:#4A4139; --muted:#8A8075;
  --line:#E2DBD0; --line2:#EFE9DF; --brand:#B0402B; --brand-dk:#8E3323; --accent:#1D4E4A;
  --num:"Bahnschrift","DIN Alternate","Helvetica Neue",Arial,sans-serif;
  --ui:"PingFang SC","Microsoft YaHei UI","Segoe UI",sans-serif;
}
html,body{margin:0;padding:0}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.pad{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#221E1A;color:#F2EDE5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.01em}
.brand .lg{width:26px;height:26px;background:var(--brand);border-radius:3px;display:grid;place-items:center}
.brand .suby{font-weight:400;font-size:11.5px;color:#B7AC9E;margin-top:1px}
.sp{flex:1}
.clock{font-family:var(--num);font-size:15px;color:#F2EDE5;letter-spacing:.04em}
.cnet{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#BFB3A5;border:1px dashed #4A433B;border-radius:3px;padding:4px 8px;white-space:nowrap}
.cnet i{width:7px;height:7px;border-radius:50%;background:#4C8A63;display:inline-block}
.cnet.cloud i{background:#4A82C4}
.cnet.off i{background:#C0703F}
.clock small{font-size:11px;color:#A99E90;margin-left:6px;letter-spacing:0}
.tbtn{border:1px solid #4A433B;background:#2C2723;color:#EFE8DD;height:32px;padding:0 12px;border-radius:3px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:#3A332C;border-color:#5C5449}
.tbtn.warn{border-color:#6B3A2C;color:#F0C9BE}
.tbtn.warn:hover{background:#4A2A20}

.main{display:grid;grid-template-columns:1fr;gap:14px;padding:14px 16px 18px;align-items:start}
.main > *{min-width:0}
.bill{min-width:0}
.grid-card{background:var(--card);border:1px solid var(--line);min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line2)}
.toolbar input[type="search"]{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:#FBFAF7;padding:8px 10px;min-height:36px;border-radius:3px;font-size:13.5px;outline:none}
.toolbar input[type="search"]:focus{border-color:var(--brand);background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);height:30px;padding:0 10px;border-radius:15px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:#221E1A;border-color:#221E1A;color:#F5F0E8}
.chip b{font-family:var(--num);color:var(--brand);margin-left:5px;font-weight:600}
.chip[aria-pressed="true"] b{color:#F1B9A8}

.dish-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:12px;max-height:none}
.dish{border:1px solid var(--line2);border-radius:3px;padding:9px 10px;background:#fff;display:grid;gap:6px;transition:.12s}
.dish:hover{border-color:#D6CCBE;box-shadow:0 1px 0 #EDE6DB}
.dish .nm{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;min-height:19px;word-break:break-all}
.dish .mt{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted)}
.dish .mt .ct{color:#9A8F82}
.dish .mt .pr{font-family:var(--num);color:var(--ink2);font-size:12.5px}
.dish .acts{display:flex;justify-content:space-between;align-items:center;gap:8px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#FBFAF7}
.step button{width:28px;height:27px;border:0;background:#fff;color:var(--ink2);font-size:15px;line-height:1;cursor:pointer}
.step button:hover:not(:disabled){background:#F3EDE3;color:var(--brand)}
.step button:disabled{color:#CBBFB2;cursor:not-allowed}
.step .qn{width:28px;text-align:center;font-family:var(--num);font-size:13.5px;color:var(--ink)}
.dish .amt{font-family:var(--num);font-size:13px;color:var(--brand);font-weight:600}
.dish .amt.hide{visibility:hidden}

.cart{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-self:start;max-height:calc(100vh - 90px)}
.cart-hd{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line2)}
.cart-hd h3{margin:0;font-size:14px;font-weight:700}
.cart-hd .cnt{font-family:var(--num);font-size:12.5px;color:var(--brand)}
.cart-meta{display:grid;grid-template-columns:1fr 78px;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.cart-meta label{display:grid;gap:4px;font-size:11.5px;color:var(--muted)}
.cart-meta select,.cart-meta input{border:1px solid var(--line);background:#FBFAF7;height:32px;border-radius:3px;font-size:13px;padding:0 8px;outline:none;width:100%}
.cart-meta select:focus,.cart-meta input:focus{border-color:var(--brand);background:#fff}
.cart-list{flex:1;overflow:auto;min-height:110px;max-height:44vh}
.cart-empty{padding:30px 14px;text-align:center;font-size:12.5px;color:#B6ABA0}
.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px dashed var(--line2)}
.cart-row .cn{font-size:13px;color:var(--ink);line-height:1.3}
.cart-row .cn em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.cart-row .cb{font-family:var(--num);font-size:13px;color:var(--ink2);min-width:56px;text-align:right}
.cart-sum{padding:11px 14px;border-top:1px solid var(--line);display:grid;gap:9px}
.cart-sum .tot{display:flex;justify-content:space-between;align-items:baseline}
.cart-sum .tot span{font-size:12px;color:var(--muted)}
.cart-sum .tot b{font-family:var(--num);font-size:22px;color:var(--brand)}
.cart-btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.cart-btns .go{border:0;background:var(--brand);color:#fff;height:42px;border-radius:3px;font-weight:600;font-size:14.5px;letter-spacing:.04em;cursor:pointer}
.cart-btns .go:hover{background:var(--brand-dk)}
.cart-btns .clr{border:1px solid var(--line);background:#fff;height:42px;padding:0 14px;border-radius:3px;cursor:pointer;font-size:13px;color:var(--ink2)}
.cart-tip{padding:0 14px 11px;font-size:11.5px;color:#A89D91;line-height:1.6}

.bill{background:var(--card);border:1px solid var(--line);margin-top:2px}
.bill-hd{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--line2);gap:10px;flex-wrap:wrap}
.bill-hd h3{margin:0;font-size:14px;font-weight:700}
.bill-hd .stat{font-size:12px;color:var(--muted)}
.bill-hd .stat b{font-family:var(--num);color:var(--ink);font-size:13.5px}
.bill-wrap{overflow:auto;max-height:320px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:#FBF8F3;text-align:left;font-weight:600;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:middle}
.tbl td.no{font-family:var(--num);color:var(--ink)}
.tbl td.amt{font-family:var(--num);text-align:right;color:var(--brand)}
.tbl td.time{font-family:var(--num);white-space:nowrap;color:var(--muted)}
.tbl td.items{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7B7166}
.tbl .del{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:3px;height:24px;padding:0 7px;cursor:pointer;font-size:11.5px}
.tbl .del:hover{border-color:#C9745F;color:#B0402B}
.bill-none{padding:22px 14px;text-align:center;font-size:12.5px;color:#B6ABA0}

.foot{padding:11px 18px;border-top:1px solid var(--line);background:#FBF8F3;font-size:11.5px;color:#9C9286;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:#221E1A;color:#F6F1E9;padding:9px 16px;border-radius:3px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:768px){
  .dish-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .main{grid-template-columns:minmax(0,1fr) 330px}
  .cart{position:sticky;top:12px}
  .bill{grid-column:1/-1}
}
@media (min-width:1200px){
  .dish-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .main{grid-template-columns:minmax(0,1fr) 348px;padding:16px 22px 22px}
}
@media (max-width:520px){
  .topbar{gap:8px;padding:10px 12px}
  .dish-grid{grid-template-columns:1fr 1fr;gap:8px;padding:10px}
  .dish{padding:8px}
  .dish .mt{font-size:10.5px}
  .dish .mt .pr{font-size:11.5px}
  .dish .nm{font-size:12.5px}
  .step button{width:24px}
  .step .qn{width:24px}
  .dish .amt{font-size:12px}
  td.items, th.items{display:none}
  .tbl th, .tbl td{padding:7px 8px}
  .clock{font-size:13px}
}
</style>
</head>

      </div>
      <div class="bill-none" id="billEmpty">还没有开单。选好菜后点「开单」，记录会留在下面。</div>
    </section>
  </main>

  <footer class="foot">
    <span>演示页面 · 菜品与价格取自本地订单库（<span id="skun"></span> 个 SKU · <span id="tabn"></span> 个桌台）</span>
    <span>数据仅存本机浏览器，不写入任何真实商户云端</span>
  </footer>
</div>

  async function syncRemote(silent){

    if (res.mode === 'api') {
      var pend = ORDERS.filter(function(o){ return !remoteNos[o.no]; });

        try {
          await fetch('./api/orders', {method: 'POST', headers: {'Content-Type': 'application/json'},

    } catch (e) {}
    var no = String(max + 1);
    try { localStorage.setItem(SEQ_KEY, no); } catch (e) {}

  function renderDishes(){

      }).join('');
    }
    var sum = ORDERS.reduce(function(a, o){ return a + Number(o.amount || 0); }, 0);
    document.getElementById('billStat').innerHTML = '共 <b>' + ORDERS.length + '</b> 笔 · 合计 <b>' + money(sum) + '</b>';
  }

  async function submit(){
    var ns = cartNames();
    if (!ns.length) { toast('先选一道菜再开单'); return; }
    var items = [], total = 0;
    ns.forEach(function(n){
      var g = IDX[n], q = CART[n];
      total += g.p * q;
      items.push({name: n, price: g.p, unit: g.u, cat: g.c, qty: q});
    });
    var table = document.getElementById('tableSel').value;
    var pax = Math.max(1, Math.min(40, parseInt(document.getElementById('paxInput').value, 10) || 1));
    var no = nextNo();
    var order = {no: no, time: nowStr(), table: table, pax: pax,
                 items: items, amount: +total.toFixed(2), state: '03'};
    ORDERS.unshift(order);
    saveOrders();
    CART = {};
    renderDishes(); renderCart(); renderBill();
    try {
      var r = await fetch('./api/orders', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({order: order})});
      if (r.ok) {
        var j = await r.json();
        setSrc('api');
        toast('已开单 ' + no + ' · ' + money(total) +
              (j.pushed ? '，本地与 GitHub 已同时写入'
                        : ('，本地已存，' + (j.pending || 1) + ' 笔待监听自动补传')));
        return;
      }
    } catch (e) {}
    toast('已开单 ' + no + ' · ' + money(total) + '，暂存本机，重启监听后自动补传');
  }

  /* ---------- 导出 ---------- */
  function download(name, text, mime){
    var blob = new Blob(['\ufeff' + text], {type: (mime || 'text/plain') + ';charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1200);
  }
  function exportJson(){
    if (!ORDERS.length) { toast('还没有可导出的点餐单'); return; }
    var payload = {shop: META.shop, term: META.term, exported: nowStr(), count: ORDERS.length, orders: ORDERS};
    var ts = nowStr().replace(/[-: ]/g, '').slice(0, 12);
    download('点餐单_' + ts + '.json', JSON.stringify(payload, null, 1), 'application/json');
    toast('已导出 ' + ORDERS.length + ' 笔，可用于看板「导入点餐单」');
  }

  /* ---------- 事件 ---------- */
  document.getElementById('dishGrid').addEventListener('click', function(e){
    var a = e.target.closest('[data-add]'), s = e.target.closest('[data-sub]');
    if (a) change(a.getAttribute('data-add'), 1);
    else if (s) change(s.getAttribute('data-sub'), -1);
  });
  document.getElementById('cartList').addEventListener('click', function(e){
    var a = e.target.closest('[data-add]'), s = e.target.closest('[data-sub]');
    if (a) change(a.getAttribute('data-add'), 1);
    else if (s) change(s.getAttribute('data-sub'), -1);
  });
  document.getElementById('catChips').addEventListener('click', function(e){
    var b = e.target.closest('.chip');
    if (!b) return;
    catFilter = b.getAttribute('data-cat');
    renderChips(); renderDishes();
  });
  var t;
  document.getElementById('qDish').addEventListener('input', function(e){
    clearTimeout(t);
    var v = e.target.value;
    t = setTimeout(function(){ kw = v; renderDishes(); }, 150);
  });
  document.getElementById('cartSubmit').addEventListener('click', submit);
  document.getElementById('cartClear').addEventListener('click', function(){
    if (!cartNames().length) { toast('当前点单已是空的'); return; }
    CART = {}; renderDishes(); renderCart(); toast('已清空当前点单');
  });
  document.getElementById('billBody').addEventListener('click', async function(e){
    var b = e.target.closest('[data-del]');
    if (!b) return;
    var no = b.getAttribute('data-del');
    if (!window.confirm('撤销订单 ' + no + ' ？撤销后看板里也不再计入。')) return;
    ORDERS = ORDERS.filter(function(o){ return o.no !== no; });
    saveOrders(); renderBill();
    try { await fetch('./api/orders?no=' + encodeURIComponent(no), {method: 'DELETE'}); } catch (e) {}
    toast('已撤销 ' + no);
  });
  document.getElementById('btnSyncNow').addEventListener('click', syncAll);
  document.getElementById('btnExportJson').addEventListener('click', exportJson);
  document.getElementById('btnClearAll').addEventListener('click', function(){
    if (!ORDERS.length) { toast('没有点餐记录'); return; }
    if (!window.confirm('清空全部 ' + ORDERS.length + ' 笔点餐记录？此操作不可恢复。')) return;
    ORDERS = []; saveOrders(); renderBill(); toast('已清空全部记录');
  });

  /* ---------- 初始化 ---------- */
  function tick(){
    var d = new Date();
    document.getElementById('clk').textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    document.getElementById('clkDate').textContent = d.getFullYear() + '/' + pad2(d.getMonth()+1) + '/' + pad2(d.getDate());
  }
  tick(); setInterval(tick, 1000);

  var sel = document.getElementById('tableSel');
  sel.innerHTML = '<option value="">无桌台（打包）</option>' + TABLES.map(function(tb){
    return '<option value="' + esc(tb) + '">' + esc(tb) + '</option>';
  }).join('');
  sel.value = TABLES.filter(function(tb){ return tb.indexOf('包间') === 0; })[0] || '';

  document.getElementById('skun').textContent = META.sku;
  document.getElementById('tabn').textContent = META.tables;

  ORDERS = loadOrders();
  renderChips(); renderDishes(); renderCart(); renderBill();
  if (ORDERS.length) setTimeout(function(){ toast('已载入本机留存的 ' + ORDERS.length + ' 笔点餐单'); }, 500);
  syncRemote(true);
})();
</script>
</body>
</html>
